<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0c0c0d; color: #f2f2f0; font-family: Geist, sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(50% 70% at 78% 30%, rgba(255,107,44,.16), transparent 70%); }
  .copy { position: absolute; left: 72px; top: 88px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { margin-top: 64px; font-size: 64px; line-height: 1; letter-spacing: -0.05em; font-weight: 660; }
  p { margin-top: 28px; font-size: 26px; color: #a3a3a8; line-height: 1.35; letter-spacing: -0.01em; }
  .shot { position: absolute; left: 660px; top: 120px; width: 760px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 40px 90px rgba(0,0,0,.8); }
  .pill { position: absolute; left: 720px; top: 64px; white-space: nowrap; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px 0 14px; border-radius: 999px; background: rgba(20,20,22,.92); border: 1px solid rgba(255,255,255,.14); font-size: 17px; }
  .pill b { font-weight: 600; } .pill span { color: #a3a3a8; }
  .bars { display: flex; gap: 3px; align-items: center; height: 16px; }
  .bars i { width: 3px; border-radius: 2px; background: #ff6b2c; }
  .tag { position: absolute; left: 72px; bottom: 64px; font-size: 20px; color: #76767c; }
  .tag b { color: #ff6b2c; font-weight: 600; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand"><img src="../public/icon-512.png">s1</div>
    <h1>Say it.<br>Your Mac does it.</h1>
    <p>The open-source voice agent for macOS.</p>
  </div>
  <div class="pill"><span class="bars"><i style="height:30%"></i><i style="height:80%"></i><i style="height:55%"></i><i style="height:100%"></i></span><b>Listening</b><span>open Notes and write the shopping list</span></div>
  <img class="shot" src="../public/shots/app.png">
  <div class="tag"><b>Free</b> and MIT licensed. Works with any model, or none.</div>
</body></html>
